_schema-version: "3.3"
ID: ui5-wui-sd-rocket2
description: UI5 Seed Application
version: 1.0.3
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

modules:
  - name: ui5-wui-sd-rocket2-dest-content
    type: com.sap.application.content
    requires:
      - name: ui5-wui-shared-dest-srv
        parameters:
          content-target: true
      - name: ui5-wui-sd-rocket2-repo-host
        parameters:
          service-key:
            name: ui5-wui-sd-rocket2-repo-host-key
      - name: ui5-wui-sd-rocket2-uaa
        parameters:
          service-key:
            name: ui5-wui-sd-rocket2-uaa-key
    parameters:
      content:
        instance:
          destinations:
            - Name: ui5-wui-sd-rocket2_html_repo_host
              ServiceInstanceName: ui5-wui-sd-rocket2-html5-srv
              ServiceKeyName: ui5-wui-sd-rocket2-repo-host-key
              sap.cloud.service: wui.cp
            - Name: ui5-wui-sd-rocket2_uaa
              ServiceInstanceName: ui5-wui-sd-rocket2-xsuaa-srv
              ServiceKeyName: ui5-wui-sd-rocket2-uaa-key
              sap.cloud.service: wui.cp
              Authentication: OAuth2UserTokenExchange
          existing_destinations_policy: ignore
    build-parameters:
      no-source: true
  - name: ui5-wui-sd-rocket2-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: ui5-wui-sd-rocket2-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - ui5-wui-sd-rocket2.zip
          name: ui5-wui-sd-rocket2
          target-path: resources/
  - name: ui5-wui-sd-rocket2
    type: html5
    path: .
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: ui5-wui-shared-dest-srv
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: ui5-wui-shared-dest-srv
  - name: ui5-wui-sd-rocket2-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-name: ui5-wui-sd-rocket2-xsuaa-srv
      service-plan: application
  - name: ui5-wui-sd-rocket2-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: ui5-wui-sd-rocket2-html5-srv
      service-plan: app-host
